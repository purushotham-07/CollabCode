services:
  - type: web
    name: collabcode-backend
    runtime: java
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar app/target/collabcode-app-1.0.0-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_ACCESS_TOKEN_EXPIRATION_MS
        value: 900000
      - key: JWT_REFRESH_TOKEN_EXPIRATION_MS
        value: 604800000
      - key: UPSTASH_REDIS_REST_URL
        sync: false # Set your Upstash Redis REST URL in Render Dashboard
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # Set your Upstash Redis REST Token in Render Dashboard
