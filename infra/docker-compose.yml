services:
  mongo:
    image: mongo:7.0
    container_name: collabcode-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-replica.js:/scripts/init-replica.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: collabcode-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./mongo/init-replica.js:/scripts/init-replica.js:ro
    command: >
      bash -c "mongosh --host mongo:27017 /scripts/init-replica.js"
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: collabcode-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "collabcode_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: app/Dockerfile
    container_name: collabcode-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGO_URI=mongodb://mongo:27017/collabcode?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=collabcode_redis_secret
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost/auth/callback}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: collabcode-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost/api
      - VITE_WS_BASE_URL=ws://localhost/ws
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: collabcode-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
  redis_data:
